# ═══════════════════════════════════════════════════════════════════════
# Fiter — Nightly GL Reconciliation Job Configuration
# Include this file in your Fineract deployment:
#   --spring.config.import=classpath:application-reconciliation.properties
# ═══════════════════════════════════════════════════════════════════════

# Output directory for reconciliation reports (summary + CSV)
# Ensure the Fineract process has write permissions to this path.
fiter.reconciliation.output-dir=/var/fineract/reports/reconciliation

# Cron expression for the nightly job.
# Default: 2:30 AM every day (after COB which usually ends ~01:00-02:00 AM).
# Format: second minute hour day-of-month month day-of-week
fiter.reconciliation.cron=0 30 2 * * ?

# Whether to use the @Scheduled trigger (true) or rely solely on Fineract's
# internal job scheduler (false). Set to false if you register the job via
# c_job / c_scheduler_detail tables.
fiter.reconciliation.scheduled.enabled=true

# Minimum delta (in currency units) to classify as a discrepancy.
# Amounts below this are treated as rounding differences and ignored.
fiter.reconciliation.delta-threshold=0.01

# Maximum number of loans to scan per run (safety circuit-breaker).
# Set to 0 for unlimited.
fiter.reconciliation.max-loans=50000

# Email/alert destination for critical discrepancies (UNBALANCED / DUPLICATE).
# Leave blank to disable email alerts (use log monitoring instead).
fiter.reconciliation.alert.email=accounting@fiter.io

# Whether to include CLOSED loans in the reconciliation scan.
# Disabled by default (focus on active portfolio).
fiter.reconciliation.include-closed-loans=false
